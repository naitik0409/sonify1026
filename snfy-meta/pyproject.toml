[build-system]
requires = ["setuptools>=77.0.3", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "snfy"
version = "0.2.0"
description = "Alias for sonify1026 - `pip install snfy` is the same as `pip install sonify1026`"
readme = {file = "README.md", content-type = "text/markdown"}
requires-python = ">=3.9"
license = "MIT"
authors = [
    {name = "Naitik", email = "sanjeevshrivastava898@gmail.com"},
]
maintainers = [
    {name = "Naitik", email = "sanjeevshrivastava898@gmail.com"},
]
keywords = [
    "tts",
    "text-to-speech",
    "voice",
    "speech",
    "synthesis",
    "hindi",
    "hinglish",
    "indian-english",
    "sonify",
    "snfy",
]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Topic :: Multimedia :: Sound/Audio :: Speech",
    "Natural Language :: English",
    "Natural Language :: Hindi",
]
dependencies = [
    "sonify1026>=0.2.0",
]

[project.urls]
Homepage = "https://github.com/naitik0409/sonify1026"
Source = "https://github.com/naitik0409/sonify1026"
Issues = "https://github.com/naitik0409/sonify1026/issues"

[tool.setuptools]
packages = []
