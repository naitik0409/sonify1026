name: Publish sonify1026 to PyPI

on:
  release:
    types: [published]
  workflow_dispatch:

jobs:
  build-and-publish:
    runs-on: ubuntu-latest
    environment: pypi
    permissions:
      id-token: write      # PyPI Trusted Publishing (OIDC)
      contents: read
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      # Only publish when the release tag matches this package's version,
      # so a release for one package does not re-publish the other.
      - name: Resolve versions
        id: ver
        run: |
          PKG=$(python -c "import tomllib;print(tomllib.load(open('pyproject.toml','rb'))['project']['version'])")
          if [ "${GITHUB_REF_TYPE}" = "tag" ]; then TAG="${GITHUB_REF_NAME#v}"; else TAG="$PKG"; fi
          if [ "$TAG" = "$PKG" ]; then MATCH=true; else MATCH=false; fi
          echo "package=$PKG tag=$TAG match=$MATCH"
          echo "match=$MATCH" >> "$GITHUB_OUTPUT"

      - name: Install build tooling
        if: steps.ver.outputs.match == 'true'
        run: python -m pip install --upgrade build twine

      - name: Build sdist and wheel
        if: steps.ver.outputs.match == 'true'
        run: python -m build

      - name: Check distributions
        if: steps.ver.outputs.match == 'true'
        run: python -m twine check dist/*

      - name: Publish to PyPI
        if: steps.ver.outputs.match == 'true'
        uses: pypa/gh-action-pypi-publish@release/v1
        with:
          password: ${{ secrets.PYPI_API_TOKEN }}

      - name: Nothing to publish
        if: steps.ver.outputs.match != 'true'
        run: echo "Release tag does not match sonify1026 version; skipping."
